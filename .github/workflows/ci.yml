name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reactive-correction-graph

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: reactive-correction-graph

      - name: Checkout unreleased Settle validation baseline
        uses: actions/checkout@v6
        with:
          repository: Luciano0322/settle
          ref: db74dda02893c1c643e312b9855f8ff62e8cef89
          path: settle

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: reactive-correction-graph/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            reactive-correction-graph/pnpm-lock.yaml
            settle/pnpm-lock.yaml

      - name: Build unreleased Settle
        working-directory: settle
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser test
        run: pnpm test:browser
